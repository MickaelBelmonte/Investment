    // Error Boundary component to prevent blank/black screen on runtime errors
    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("React Error Boundary caught an error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-8 text-center text-red-400 bg-slate-900 min-h-screen flex flex-col items-center justify-center">
              <h2 className="text-2xl font-bold mb-4">Une erreur est survenue lors de l'affichage.</h2>
              <p className="text-sm font-mono bg-slate-950 p-4 rounded-lg border border-red-900 max-w-xl text-left">
                {this.state.error?.toString()}
              </p>
              <button 
                onClick={() => window.location.reload()}
                className="mt-6 px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-500"
              >
                Recharger la page
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function App() {
      const [lang, setLang] = useState('FR');
      const [country, setCountry] = useState('FR');
      const [brokerId, setBrokerId] = useState('bdirect');
      const [theme, setTheme] = useState('dark');
      const [initialCapital, setInitialCapital] = useState(5000);
      const [recurringAmount, setRecurringAmount] = useState(300);
      const [frequency, setFrequency] = useState(12);
      const [years, setYears] = useState(20);
      const [annualReturn, setAnnualReturn] = useState(8.5);
      const [inflation, setInflation] = useState(2.0);
      const [brokerFeePercent, setBrokerFeePercent] = useState(0.2);
      const [drip, setDrip] = useState(true);
      const [simMode, setSimMode] = useState('normal'); // 'normal', 'target', 'lump'
      const [targetCapitalGoal, setTargetCapitalGoal] = useState(200000);
      const [withdrawalRate, setWithdrawalRate] = useState(4.0);
      const [isMobile, setIsMobile] = useState(false);
      const [savedScenarios, setSavedScenarios] = useState([]);

      const t = TRANSLATIONS[lang];
      const taxConfig = COUNTRIES_TAX[country];

      // Handle Theme
      useEffect(() => {
        document.body.className = theme === 'dark' 
          ? 'bg-slate-950 text-slate-100 min-h-screen transition-colors duration-300 font-sans antialiased dark' 
          : 'bg-slate-50 text-slate-900 min-h-screen transition-colors duration-300 font-sans antialiased light';
      }, [theme]);

      // Sync Broker Fees
      useEffect(() => {
        const broker = BROKERS_CONFIG.find(b => b.id === brokerId);
        if (broker && brokerId !== 'custom') {
          setBrokerFeePercent(broker.feePercent);
        }
      }, [brokerId]);

      useEffect(() => {
        const checkMobile = () => setIsMobile(window.innerWidth < 768);
        checkMobile();
        window.addEventListener('resize', checkMobile);
        return () => window.removeEventListener('resize', checkMobile);
      }, []);

      useEffect(() => {
        const loaded = localStorage.getItem('pea_scenarios');
        if (loaded) {
          try { setSavedScenarios(JSON.parse(loaded)); } catch(e){}
        }
      }, []);

      const [portfolio, setPortfolio] = useState([
        { etfId: 'wpea', weight: 60 },
        { etfId: 'panx', weight: 20 },
        { etfId: 'ese', weight: 20 }
      ]);

      const portfolioMetrics = useMemo(() => {
        let totalWeight = portfolio.reduce((acc, curr) => acc + curr.weight, 0);
        if (totalWeight === 0) return { avgTer: 0, avgHist: 0, valid: false, riskScore: 0, riskLabel: 'Modéré' };

        let avgTer = 0;
        let avgHist = 0;
        let riskScore = 0;
        const riskWeights = { 'Faible': 1, 'Modéré': 2, 'Élevé': 3, 'Très Élevé': 4 };

        portfolio.forEach(item => {
          const etf = ETF_DATABASE.find(e => e.id === item.etfId);
          if (etf) {
            avgTer += (etf.ter * item.weight) / totalWeight;
            avgHist += (etf.hist10y * item.weight) / totalWeight;
            riskScore += (riskWeights[etf.risk] || 2) * (item.weight / 100);
          }
        });

        let riskLabel = 'Modéré';
        if (riskScore > 3.2) riskLabel = 'Très Élevé';
        else if (riskScore > 2.6) riskLabel = 'Élevé';
        else if (riskScore < 1.8) riskLabel = 'Conservateur';

        return {
          avgTer: Number(avgTer.toFixed(2)),
          avgHist: Number(avgHist.toFixed(2)),
          totalWeight,
          valid: totalWeight === 100,
          riskLabel
        };
      }, [portfolio]);

      const calculatedRequiredMonthly = useMemo(() => {
        if (simMode !== 'target') return recurringAmount;
        const periodsPerYear = Number(frequency);
        const totalPeriods = years * periodsPerYear;
        const rate = (annualReturn - portfolioMetrics.avgTer) / 100 / periodsPerYear;
        if (rate <= 0) return Math.max(0, (targetCapitalGoal - initialCapital) / totalPeriods);
        
        const futureValueOfInitial = initialCapital * Math.pow(1 + rate, totalPeriods);
        const neededFromContributions = targetCapitalGoal - futureValueOfInitial;
        if (neededFromContributions <= 0) return 0;
        
        const pmt = neededFromContributions * rate / (Math.pow(1 + rate, totalPeriods) - 1);
        return Math.round(pmt);
      }, [simMode, targetCapitalGoal, initialCapital, years, frequency, annualReturn, portfolioMetrics.avgTer]);

      const activeRecurring = simMode === 'target' ? calculatedRequiredMonthly : (simMode === 'lump' ? 0 : recurringAmount);

      const simulationData = useMemo(() => {
        const data = [];
        const periodsPerYear = Number(frequency);
        const totalPeriods = years * periodsPerYear;
        
        const effectiveReturn = drip ? annualReturn : (annualReturn - 1.5);
        const netTerRatePerPeriod = Math.pow(1 + Math.max(-90, effectiveReturn - portfolioMetrics.avgTer) / 100, 1 / periodsPerYear) - 1;
        const inflationRatePerPeriod = Math.pow(1 + Math.max(-90, effectiveReturn - portfolioMetrics.avgTer - inflation) / 100, 1 / periodsPerYear) - 1;
        const brokerFeeDecimal = brokerFeePercent / 100;

        let totalInvested = initialCapital;
        let netPeaValue = initialCapital * (1 - brokerFeeDecimal);
        let inflationAdjustedValue = initialCapital * (1 - brokerFeeDecimal);

        // Lump sum scenario alternative for comparison mode
        let lumpSumInvested = initialCapital + (recurringAmount * years * periodsPerYear);
        let lumpSumNetValue = lumpSumInvested * (1 - brokerFeeDecimal);

        data.push({
          year: 0,
          invested: Math.round(totalInvested),
          peaNet: Math.round(netPeaValue),
          ctoNet: Math.round(netPeaValue),
          lumpNet: Math.round(lumpSumNetValue),
          inflationNet: Math.round(inflationAdjustedValue)
        });

        for (let p = 1; p <= totalPeriods; p++) {
          const periodicContribution = activeRecurring;
          const netContribution = periodicContribution * (1 - brokerFeeDecimal);

          totalInvested += periodicContribution;
          netPeaValue = (netPeaValue + netContribution) * (1 + netTerRatePerPeriod);
          lumpSumNetValue = lumpSumNetValue * (1 + netTerRatePerPeriod);
          inflationAdjustedValue = (inflationAdjustedValue + netContribution) * (1 + inflationRatePerPeriod);

          if (p % periodsPerYear === 0) {
            const currentYear = p / periodsPerYear;
            const capitalGain = Math.max(0, netPeaValue - totalInvested);
            const lumpGain = Math.max(0, lumpSumNetValue - lumpSumInvested);
            
            const optTaxAmount = taxConfig.optTax(currentYear, capitalGain);
            const stdTaxAmount = taxConfig.stdTax(currentYear, capitalGain);
            const lumpTaxAmount = taxConfig.optTax(currentYear, lumpGain);

            data.push({
              year: currentYear,
              invested: Math.round(totalInvested),
              peaNet: Math.round(netPeaValue - optTaxAmount),
              ctoNet: Math.round(netPeaValue - stdTaxAmount),
              lumpNet: Math.round(lumpSumNetValue - lumpTaxAmount),
              inflationNet: Math.round(inflationAdjustedValue)
            });
          }
        }
        return data;
      }, [initialCapital, activeRecurring, recurringAmount, frequency, years, annualReturn, inflation, portfolioMetrics.avgTer, brokerFeePercent, country, drip]);

      const lastDataPoint = simulationData[simulationData.length - 1];
      const taxSaved = lastDataPoint ? lastDataPoint.peaNet - lastDataPoint.ctoNet : 0;

      // FIRE Annuity Calculations
      const fireIncomeYearly = useMemo(() => {
        if (!lastDataPoint) return 0;
        return Math.round(lastDataPoint.peaNet * (withdrawalRate / 100));
      }, [lastDataPoint, withdrawalRate]);

      const fireIncomeMonthly = Math.round(fireIncomeYearly / 12);

      const pieChartData = useMemo(() => {
        return portfolio.map(item => {
          const etf = ETF_DATABASE.find(e => e.id === item.etfId);
          return {
            name: etf ? etf.ticker : item.etfId,
            value: item.weight,
            color: etf ? etf.color : '#64748b'
          };
        }).filter(d => d.value > 0);
      }, [portfolio]);

      const handleWeightChange = (index, value) => {
        const updated = [...portfolio];
        updated[index].weight = Number(value);
        setPortfolio(updated);
      };

      const handleAddEtf = (etfId) => {
        if (!portfolio.find(p => p.etfId === etfId)) {
          setPortfolio([...portfolio, { etfId, weight: 0 }]);
        }
      };

      const handleRemoveEtf = (index) => {
        setPortfolio(portfolio.filter((_, i) => i !== index));
      };

      const exportToCSV = () => {
        let csvContent = "data:text/csv;charset=utf-8,Annee;Capital_Investi;Valeur_Optimisee;Valeur_Standard;Ajuste_Inflation\n";
        simulationData.forEach(row => {
          csvContent += `${row.year};${row.invested};${row.peaNet};${row.ctoNet};${row.inflationNet}\n`;
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "simulation_investissement_pro.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const downloadTextReport = () => {
        const reportText = `RAPPORT DE SIMULATION D'INVESTISSEMENT PRO\n` +
          `==========================================\n` +
          `Résidence Fiscale : ${taxConfig.name}\n` +
          `Apport Initial : ${initialCapital} ${taxConfig.currency}\n` +
          `Versement Régulier : ${activeRecurring} ${taxConfig.currency} (${frequency} fois/an)\n` +
          `Durée : ${years} ans\n` +
          `Rendement Estimé : ${annualReturn}% | Frais TER Moyens : ${portfolioMetrics.avgTer}%\n` +
          `------------------------------------------\n` +
          `RÉSULTATS FINAUX (${years} ans) :\n` +
          `- Capital Investi Total : ${lastDataPoint?.invested} ${taxConfig.currency}\n` +
          `- Valeur Nette Optimisée (${taxConfig.optName}) : ${lastDataPoint?.peaNet} ${taxConfig.currency}\n` +
          `- Valeur Nette Standard (${taxConfig.stdName}) : ${lastDataPoint?.ctoNet} ${taxConfig.currency}\n` +
          `- Économie Fiscale Réalisée : +${taxSaved} ${taxConfig.currency}\n` +
          `- Rente Passive Estimée (Regle des ${withdrawalRate}%) : ${fireIncomeMonthly} ${taxConfig.currency}/mois\n`;

        const blob = new Blob([reportText], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'rapport_investissement.txt';
        link.click();
        URL.revokeObjectURL(url);
      };

      const saveCurrentScenario = () => {
        const newScenario = {
          id: Date.now(),
          name: `Scénario ${savedScenarios.length + 1} (${years} ans, ${annualReturn}%)`,
          finalNet: lastDataPoint?.peaNet
        };
        const updated = [...savedScenarios, newScenario];
        setSavedScenarios(updated);
        localStorage.setItem('pea_scenarios', JSON.stringify(updated));
      };

      const deleteScenario = (id) => {
        const updated = savedScenarios.filter(s => s.id !== id);
        setSavedScenarios(updated);
        localStorage.setItem('pea_scenarios', JSON.stringify(updated));
      };

      return (
        <div className="max-w-7xl mx-auto px-4 py-6 md:py-10 space-y-8">
          {/* Header Bar */}
          <header className="glass-card glow-effect p-6 rounded-2xl flex flex-col lg:flex-row lg:items-center justify-between gap-6">
            <div>
              <h1 className="text-2xl md:text-3xl font-extrabold bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 bg-clip-text text-transparent">
                {t.title}
              </h1>
              <p className="text-slate-400 text-xs md:text-sm mt-1">{t.subtitle}</p>
            </div>

            <div className="flex flex-wrap items-center gap-3">
              <div>
                <label className="text-xs text-slate-400 block mb-1">{t.brokerLabel}</label>
                <select
                  value={brokerId}
                  onChange={(e) => setBrokerId(e.target.value)}
                  className="bg-slate-900 dark:bg-slate-900 border border-slate-700 text-slate-100 rounded-lg text-xs md:text-sm px-3 py-2 focus:ring-2 focus:ring-emerald-500 outline-none"
                >
                  {BROKERS_CONFIG.map((b) => (
                    <option key={b.id} value={b.id}>{b.name}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="text-xs text-slate-400 block mb-1">{t.countryLabel}</label>
                <select
                  value={country}
                  onChange={(e) => setCountry(e.target.value)}
                  className="bg-slate-900 border border-slate-700 text-slate-100 rounded-lg text-xs md:text-sm px-3 py-2 focus:ring-2 focus:ring-emerald-500 outline-none"
                >
                  {Object.keys(COUNTRIES_TAX).map((c) => (
                    <option key={c} value={c}>{COUNTRIES_TAX[c].name}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="text-xs text-slate-400 block mb-1">{t.langLabel}</label>
                <select
                  value={lang}
                  onChange={(e) => setLang(e.target.value)}
                  className="bg-slate-900 border border-slate-700 text-slate-100 rounded-lg text-xs md:text-sm px-3 py-2 focus:ring-2 focus:ring-emerald-500 outline-none"
                >
                  <option value="FR">🇫🇷 FR</option>
                  <option value="EN">🇬🇧 EN</option>
                  <option value="ES">🇪🇸 ES</option>
                </select>
              </div>

              <div>
                <label className="text-xs text-slate-400 block mb-1">{t.themeLabel}</label>
                <button
                  onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
                  className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 px-3 py-2 rounded-lg text-xs font-semibold"
                >
                  {theme === 'dark' ? '☀️ Clair' : '🌙 Sombre'}
                </button>
              </div>
            </div>
          </header>

          {/* Main Grid */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
            {/* Sidebar Controls */}
            <div className="glass-card rounded-2xl p-6 space-y-6">
              <h2 className="text-lg font-bold border-b border-slate-800 pb-3">{t.paramsTitle}</h2>

              <div>
                <label className="text-xs text-slate-400 block mb-2">{t.modeLabel}</label>
                <div className="grid grid-cols-3 gap-1">
                  <button
                    onClick={() => setSimMode('normal')}
                    className={`text-[10px] md:text-xs py-2 px-1 rounded-lg border font-medium transition-all ${simMode === 'normal' ? 'bg-emerald-600/30 border-emerald-500 text-emerald-300' : 'bg-slate-900 border-slate-700 text-slate-400'}`}
                  >
                    DCA Standard
                  </button>
                  <button
                    onClick={() => setSimMode('target')}
                    className={`text-[10px] md:text-xs py-2 px-1 rounded-lg border font-medium transition-all ${simMode === 'target' ? 'bg-emerald-600/30 border-emerald-500 text-emerald-300' : 'bg-slate-900 border-slate-700 text-slate-400'}`}
                  >
                    Objectif Cible
                  </button>
                  <button
                    onClick={() => setSimMode('lump')}
                    className={`text-[10px] md:text-xs py-2 px-1 rounded-lg border font-medium transition-all ${simMode === 'lump' ? 'bg-emerald-600/30 border-emerald-500 text-emerald-300' : 'bg-slate-900 border-slate-700 text-slate-400'}`}
                  >
                    Lump Sum
                  </button>
                </div>
              </div>

              {simMode === 'target' && (
                <div className="bg-emerald-950/30 p-3 rounded-xl border border-emerald-800/60 space-y-2">
                  <label className="text-xs text-emerald-300 font-medium block">{t.targetCapital}</label>
                  <input
                    type="number"
                    step="5000"
                    min="10000"
                    max="5000000"
                    value={targetCapitalGoal}
                    onChange={(e) => setTargetCapitalGoal(Number(e.target.value))}
                    className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 font-mono text-emerald-400 text-sm"
                  />
                  <div className="text-xs text-slate-300 pt-1">
                    {t.requiredMonthly} : <strong className="text-emerald-300 font-mono text-sm">{calculatedRequiredMonthly.toLocaleString('fr-FR')} {taxConfig.currency}</strong>
                  </div>
                </div>
              )}

              <div>
                <div className="flex justify-between text-sm mb-2">
                  <span className="text-slate-400">{t.initialCap}</span>
                  <span className="font-mono text-emerald-400 font-bold">{initialCapital.toLocaleString('fr-FR')} {taxConfig.currency}</span>
                </div>
                <input
                  type="range"
                  min="0"
                  max="150000"
                  step="100"
                  value={initialCapital}
                  onChange={(e) => setInitialCapital(Number(e.target.value))}
                  className="w-full accent-emerald-500 bg-slate-800 h-2 rounded-lg cursor-pointer"
                />
              </div>

              <div>
                <div className="flex justify-between text-sm mb-2">
                  <span className="text-slate-400">{t.recurringCap} {simMode !== 'normal' && '(Ajusté)'}</span>
                  <span className="font-mono text-emerald-400 font-bold">{activeRecurring.toLocaleString('fr-FR')} {taxConfig.currency}</span>
                </div>
                <input
                  type="range"
                  min="0"
                  max="5000"
                  step="100"
                  value={activeRecurring}
                  disabled={simMode !== 'normal'}
                  onChange={(e) => setRecurringAmount(Number(e.target.value))}
                  className={`w-full accent-emerald-500 bg-slate-800 h-2 rounded-lg ${simMode !== 'normal' ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer'}`}
                />
              </div>

              <div>
                <label className="text-xs text-slate-400 block mb-2">{t.freqLabel}</label>
                <select
                  value={frequency}
                  onChange={(e) => setFrequency(Number(e.target.value))}
                  className="w-full bg-slate-900 border border-slate-700 text-slate-100 rounded-lg p-2.5 text-xs md:text-sm"
                >
                  <option value={12}>{t.monthly}</option>
                  <option value={4}>{t.quarterly}</option>
                  <option value={2}>{t.biyearly}</option>
                  <option value={1}>{t.yearly}</option>
                </select>
              </div>

              <div>
                <div className="flex justify-between text-sm mb-2">
                  <span className="text-slate-400">{t.durationLabel}</span>
                  <span className="font-mono text-emerald-400 font-bold">{years} ans</span>
                </div>
                <input
                  type="range"
                  min="1"
                  max="40"
                  step="1"
                  value={years}
                  onChange={(e) => setYears(Number(e.target.value))}
                  className="w-full accent-emerald-500 bg-slate-800 h-2 rounded-lg cursor-pointer"
                />
              </div>

              <div className="pt-4 border-t border-slate-800 space-y-4">
                <h3 className="text-xs font-semibold uppercase tracking-wider">{t.assumptionsTitle}</h3>
                <div>
                  <div className="flex justify-between text-xs text-slate-400 mb-1">
                    <span>{t.estReturn}</span>
                    <span className="font-mono text-emerald-400">{annualReturn}%</span>
                  </div>
                  <input
                    type="range"
                    min="1"
                    max="15"
                    step="0.1"
                    value={annualReturn}
                    onChange={(e) => setAnnualReturn(Number(e.target.value))}
                    className="w-full accent-emerald-500 bg-slate-800 h-1.5 rounded-lg cursor-pointer"
                  />
                </div>

                <div className="flex items-center justify-between py-1">
                  <span className="text-xs text-slate-400">{t.dripLabel}</span>
                  <input
                    type="checkbox"
                    checked={drip}
                    onChange={(e) => setDrip(e.target.checked)}
                    className="w-4 h-4 accent-emerald-500 rounded bg-slate-900 border-slate-700 cursor-pointer"
                  />
                </div>

                <div>
                  <div className="flex justify-between text-xs text-slate-400 mb-1">
                    <span>{t.brokerFee} ({brokerId})</span>
                    <span className="font-mono text-slate-200">{brokerFeePercent}%</span>
                  </div>
                  <input
                    type="range"
                    min="0"
                    max="0.5"
                    step="0.05"
                    value={brokerFeePercent}
                    disabled={brokerId !== 'custom'}
                    onChange={(e) => setBrokerFeePercent(Number(e.target.value))}
                    className={`w-full accent-emerald-500 bg-slate-800 h-1.5 rounded-lg ${brokerId !== 'custom' ? 'opacity-50' : 'cursor-pointer'}`}
                  />
                </div>

                <div>
                  <div className="flex justify-between text-xs text-slate-400 mb-1">
                    <span>{t.inflation}</span>
                    <span className="font-mono text-amber-400">{inflation}%</span>
                  </div>
                  <input
                    type="range"
                    min="0"
                    max="5"
                    step="0.1"
                    value={inflation}
                    onChange={(e) => setInflation(Number(e.target.value))}
                    className="w-full accent-emerald-500 bg-slate-800 h-1.5 rounded-lg cursor-pointer"
                  />
                </div>
              </div>

              <div className="pt-4 border-t border-slate-800 flex flex-col gap-2">
                <button
                  onClick={saveCurrentScenario}
                  className="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold py-2.5 rounded-xl border border-slate-700 transition-colors"
                >
                  💾 {t.saveScenario}
                </button>
                <div className="grid grid-cols-2 gap-2">
                  <button
                    onClick={exportToCSV}
                    className="bg-slate-900 hover:bg-slate-800 text-emerald-400 text-xs font-medium py-2 px-3 rounded-xl border border-slate-800 transition-colors"
                  >
                    📊 {t.exportCsv}
                  </button>
                  <button
                    onClick={downloadTextReport}
                    className="bg-slate-900 hover:bg-slate-800 text-cyan-400 text-xs font-medium py-2 px-3 rounded-xl border border-slate-800 transition-colors"
                  >
                    📑 {t.exportPdf}
                  </button>
                </div>
              </div>
            </div>

            {/* Main Display & Charts */}
            <div className="lg:col-span-2 space-y-6">
              <div className="glass-card rounded-2xl p-6">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-6">
                  <h2 className="text-lg font-bold">{t.projectionsTitle}</h2>
                  <span className="text-xs font-semibold px-3 py-1 rounded-full bg-emerald-950 border border-emerald-800 text-emerald-300">
                    Gain Fiscal : +{taxSaved.toLocaleString('fr-FR')} {taxConfig.currency}
                  </span>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
                  <div className="bg-slate-900/90 p-3 rounded-xl border border-slate-800">
                    <span className="text-xs text-slate-400 block">{t.capInvested}</span>
                    <span className="text-base md:text-lg font-bold font-mono text-slate-100">{lastDataPoint?.invested.toLocaleString('fr-FR')} {taxConfig.currency}</span>
                  </div>
                  <div className="bg-emerald-950/40 p-3 rounded-xl border border-emerald-800">
                    <span className="text-xs text-slate-400 block">{taxConfig.optName}</span>
                    <span className="text-base md:text-lg font-bold font-mono text-emerald-300">{lastDataPoint?.peaNet.toLocaleString('fr-FR')} {taxConfig.currency}</span>
                  </div>
                  <div className="bg-slate-900/90 p-3 rounded-xl border border-slate-800">
                    <span className="text-xs text-slate-400 block">{taxConfig.stdName}</span>
                    <span className="text-base md:text-lg font-bold font-mono text-slate-300">{lastDataPoint?.ctoNet.toLocaleString('fr-FR')} {taxConfig.currency}</span>
                  </div>
                  <div className="bg-slate-900/90 p-3 rounded-xl border border-slate-800">
                    <span className="text-xs text-slate-400 block">{t.netInflation}</span>
                    <span className="text-base md:text-lg font-bold font-mono text-amber-300">{lastDataPoint?.inflationNet.toLocaleString('fr-FR')} {taxConfig.currency}</span>
                  </div>
                </div>

                <div className={isMobile ? "h-64 w-full" : "h-80 w-full"}>
                  <ResponsiveContainer width="100%" height="100%">
                    <AreaChart data={simulationData}>
                      <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" />
                      <XAxis dataKey="year" stroke="#64748b" tick={{ fontSize: 12 }} />
                      <YAxis stroke="#64748b" tickFormatter={(val) => `${(val / 1000).toFixed(0)}k`} tick={{ fontSize: 12 }} />
                      <Tooltip
                        contentStyle={{ backgroundColor: '#090d16', borderColor: '#334155', borderRadius: '12px', color: '#f8fafc' }}
                        formatter={(val) => [`${val.toLocaleString('fr-FR')} ${taxConfig.currency}`, '']}
                      />
                      <Legend />
                      <Area type="monotone" dataKey="peaNet" name={taxConfig.optName} stroke="#10b981" fill="#10b981" fillOpacity={0.15} strokeWidth={2.5} />
                      <Area type="monotone" dataKey="ctoNet" name={taxConfig.stdName} stroke="#64748b" fill="#64748b" fillOpacity={0.05} strokeWidth={2} />
                      {simMode === 'lump' && (
                        <Area type="monotone" dataKey="lumpNet" name="Lump Sum Total 100%" stroke="#8b5cf6" fill="#8b5cf6" fillOpacity={0.1} strokeWidth={2} />
                      )}
                      <Area type="monotone" dataKey="invested" name={t.capInvested} stroke="#3b82f6" fill="none" strokeDasharray="4 4" strokeWidth={2} />
                    </AreaChart>
                  </ResponsiveContainer>
                </div>
              </div>

              {/* FIRE Annuity Module */}
              <div className="glass-card rounded-2xl p-6 space-y-4 border-l-4 border-l-emerald-500">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                  <div>
                    <h2 className="text-lg font-bold">{t.fireTitle}</h2>
                    <p className="text-xs text-slate-400">{t.fireSubtitle}</p>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs text-slate-400">{t.safeWithdrawalRate} :</span>
                    <input
                      type="number"
                      step="0.5"
                      min="1"
                      max="10"
                      value={withdrawalRate}
                      onChange={(e) => setWithdrawalRate(Number(e.target.value))}
                      className="w-16 bg-slate-900 border border-slate-700 rounded-lg p-1 text-center font-mono text-emerald-400 text-xs"
                    />
                    <span className="text-xs text-slate-400">%</span>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                  <div className="bg-emerald-950/30 border border-emerald-800/60 p-4 rounded-xl">
                    <span className="text-xs text-emerald-400 block mb-1">{t.monthlyIncome}</span>
                    <span className="text-2xl font-bold font-mono text-emerald-300">{fireIncomeMonthly.toLocaleString('fr-FR')} {taxConfig.currency} / mois</span>
                  </div>
                  <div className="bg-slate-900/80 border border-slate-800 p-4 rounded-xl">
                    <span className="text-xs text-slate-400 block mb-1">{t.yearlyIncome}</span>
                    <span className="text-2xl font-bold font-mono text-slate-200">{fireIncomeYearly.toLocaleString('fr-FR')} {taxConfig.currency} / an</span>
                  </div>
                </div>
              </div>

              {/* Portfolio Builder */}
              <div className="glass-card rounded-2xl p-6 space-y-6">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-slate-800 pb-3">
                  <div>
                    <h2 className="text-lg font-bold">{t.portfolioTitle}</h2>
                    <p className="text-xs text-slate-400">{t.portfolioSubtitle}</p>
                  </div>
                  <div className="text-right">
                    <span className={`text-xs md:text-sm font-bold ${portfolioMetrics.valid ? 'text-emerald-400' : 'text-amber-400'}`}>
                      {t.totalAlloc}: {portfolioMetrics.totalWeight}%
                    </span>
                    <span className="text-xs text-slate-400 block">{t.avgTer}: {portfolioMetrics.avgTer}% | {t.volatilityLevel}: <strong className="text-cyan-300">{portfolioMetrics.riskLabel}</strong></span>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
                  <div className="md:col-span-2 space-y-3">
                    {portfolio.map((item, index) => {
                      const etf = ETF_DATABASE.find(e => e.id === item.etfId);
                      return (
                        <div key={index} className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 bg-slate-900/80 p-3 rounded-xl border border-slate-800">
                          <div className="flex-1">
                            <div className="font-semibold text-xs md:text-sm text-slate-200">{etf?.name}</div>
                            <div className="text-xs text-slate-400 font-mono">TER: {etf?.ter}% | Risque: {etf?.risk}</div>
                          </div>
                          <div className="flex items-center gap-2">
                            <input
                              type="number"
                              min="0"
                              max="100"
                              value={item.weight}
                              onChange={(e) => handleWeightChange(index, e.target.value)}
                              className="w-16 bg-slate-950 border border-slate-700 rounded-lg p-1.5 text-center text-xs font-mono text-emerald-400"
                            />
                            <span className="text-xs text-slate-400">%</span>
                            <button
                              onClick={() => handleRemoveEtf(index)}
                              className="text-red-400 hover:text-red-300 text-xs px-2 py-1 bg-red-950/40 rounded border border-red-900/60"
                            >
                              ✕
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  <div className="h-48 flex items-center justify-center bg-slate-900/50 rounded-xl border border-slate-800">
                    <ResponsiveContainer width="100%" height="100%">
                      <PieChart>
                        <Pie
                          data={pieChartData}
                          dataKey="value"
                          nameKey="name"
                          cx="50%"
                          cy="50%"
                          innerRadius={45}
                          outerRadius={70}
                          paddingAngle={3}
                        >
                          {pieChartData.map((entry, index) => (
                            <Cell key={`cell-${index}`} fill={entry.color} />
                          ))}
                        </Pie>
                        <Tooltip contentStyle={{ backgroundColor: '#090d16', borderColor: '#334155', borderRadius: '8px', color: '#f8fafc', fontSize: '11px' }} />
                      </PieChart>
                    </ResponsiveContainer>
                  </div>
                </div>

                <div className="pt-2">
                  <label className="text-xs text-slate-400 block mb-2">{t.addEtf}</label>
                  <div className="flex flex-wrap gap-2">
                    {ETF_DATABASE.map(etf => (
                      <button
                        key={etf.id}
                        onClick={() => handleAddEtf(etf.id)}
                        className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1.5 rounded-lg border border-slate-700 font-mono transition-colors"
                      >
                        + {etf.ticker} ({etf.ter}%)
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              {savedScenarios.length > 0 && (
                <div className="glass-card rounded-2xl p-6 space-y-4">
                  <h2 className="text-lg font-bold">{t.savedScenarios}</h2>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {savedScenarios.map(sc => (
                      <div key={sc.id} className="bg-slate-900/90 p-3 rounded-xl border border-slate-800 flex justify-between items-center">
                        <div>
                          <div className="text-xs font-bold text-slate-200">{sc.name}</div>
                          <div className="text-xs text-emerald-400 font-mono">Valeur finale : {sc.finalNet?.toLocaleString('fr-FR')} {taxConfig.currency}</div>
                        </div>
                        <button
                          onClick={() => deleteScenario(sc.id)}
                          className="text-red-400 hover:text-red-300 text-xs px-2 py-1 bg-red-950/40 rounded border border-red-900/60"
                        >
                          {t.delete}
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* Database Table */}
          <div className="glass-card rounded-2xl p-6">
            <h2 className="text-lg font-bold mb-4">{t.databaseTitle}</h2>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs md:text-sm text-slate-300">
                <thead className="bg-slate-900/90 text-slate-400 uppercase text-xs">
                  <tr>
                    <th className="p-3">ETF / Ticker</th>
                    <th className="p-3">{t.isin}</th>
                    <th className="p-3">{t.peaEligible}</th>
                    <th className="p-3">{t.type}</th>
                    <th className="p-3">Risque</th>
                    <th className="p-3">{t.ter}</th>
                    <th className="p-3">{t.hist10y}</th>
                    <th className="p-3">{t.action}</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/60">
                  {ETF_DATABASE.map((etf) => (
                    <tr key={etf.id} className="hover:bg-slate-800/40 transition-colors">
                      <td className="p-3 font-semibold text-slate-200">
                        {etf.name} <span className="text-xs text-slate-400 font-normal">({etf.ticker})</span>
                      </td>
                      <td className="p-3 font-mono text-xs text-slate-400">{etf.isin}</td>
                      <td className="p-3">
                        {etf.pea ? (
                          <span className="bg-emerald-950 text-emerald-400 border border-emerald-800 text-xs px-2 py-0.5 rounded-full">{t.yes}</span>
                        ) : (
                          <span className="bg-slate-900 text-slate-400 border border-slate-700 text-xs px-2 py-0.5 rounded-full">{t.no}</span>
                        )}
                      </td>
                      <td className="p-3 text-xs">{etf.type}</td>
                      <td className="p-3 text-xs font-medium text-cyan-400">{etf.risk}</td>
                      <td className="p-3 font-mono text-emerald-400">{etf.ter}%</td>
                      <td className="p-3 font-mono">{etf.hist10y}% / an</td>
                      <td className="p-3">
                        <button
                          onClick={() => setAnnualReturn(etf.hist10y)}
                          className="text-xs bg-emerald-950 hover:bg-emerald-900 text-emerald-300 px-2.5 py-1 rounded-lg border border-emerald-800 transition-colors"
                        >
                          {t.inject}
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // Render App wrapped inside Error Boundary
    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
