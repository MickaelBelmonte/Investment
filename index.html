<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terminal d'Investissement International & ETF Ultra Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>
  <style>
    .glass-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .glow-effect {
      box-shadow: 0 0 25px -5px rgba(16, 185, 129, 0.15);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, Component } = React;
    
    const RC = window.Recharts || {};
    const ResponsiveContainer = RC.ResponsiveContainer || (({children}) => <div>{children}</div>);
    const AreaChart = RC.AreaChart || (() => null);
    const Area = RC.Area || (() => null);
    const XAxis = RC.XAxis || (() => null);
    const YAxis = RC.YAxis || (() => null);
    const Tooltip = RC.Tooltip || (() => null);
    const CartesianGrid = RC.CartesianGrid || (() => null);
    const Legend = RC.Legend || (() => null);
    const PieChart = RC.PieChart || (() => null);
    const Pie = RC.Pie || (() => null);
    const Cell = RC.Cell || (() => null);

    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("React Error Boundary:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-8 text-center text-red-400 bg-slate-900 min-h-screen flex flex-col items-center justify-center">
              <h2 className="text-2xl font-bold mb-4">Erreur d'affichage détectée.</h2>
              <p className="text-sm font-mono bg-slate-950 p-4 rounded-lg border border-red-900 max-w-xl text-left">
                {this.state.error?.toString()}
              </p>
              <button onClick={() => window.location.reload()} className="mt-6 px-4 py-2 bg-emerald-600 text-white rounded-lg">
                Recharger la page
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const ETF_DATABASE = [
      { id: 'cw8', name: 'Amundi PEA MSCI World UCITS ETF', isin: 'FR0013412020', ticker: 'CW8', pea: true, ter: 0.38, hist10y: 10.5, risk: 'Modéré', color: '#3b82f6' },
      { id: 'wpea', name: 'iShares MSCI World Swap PEA UCITS ETF', isin: 'IE0002XZWYI4', ticker: 'WPEA', pea: true, ter: 0.20, hist10y: 10.5, risk: 'Modéré', color: '#10b981' },
      { id: 'panx', name: 'Amundi PEA Nasdaq 100 UCITS ETF', isin: 'FR0011871110', ticker: 'PUUST', pea: true, ter: 0.30, hist10y: 17.2, risk: 'Élevé', color: '#8b5cf6' },
      { id: 'ese', name: 'Amundi S&P 500 UCITS ETF (PEA)', isin: 'FR0013012434', ticker: 'ESE', pea: true, ter: 0.15, hist10y: 12.8, risk: 'Modéré', color: '#f59e0b' },
      { id: 'paeem', name: 'Amundi PEA MSCI Emerging ESG UCITS ETF', isin: 'LU2572257211', ticker: 'PAEEM', pea: true, ter: 0.30, hist10y: 4.8, risk: 'Élevé', color: '#ec4899' },
      { id: 'semi', name: 'Amundi MSCI Global Semiconductors UCITS ETF', isin: 'LU1900066915', ticker: 'SEMI', pea: false, ter: 0.35, hist10y: 22.4, risk: 'Très Élevé', color: '#06b6d4' },
      { id: 'robo', name: 'Amundi Stoxx Global Automation & Robotics', isin: 'LU1838002480', ticker: 'ROBO', pea: false, ter: 0.40, hist10y: 11.2, risk: 'Élevé', color: '#6366f1' },
      { id: 'inrg', name: 'iShares Global Clean Energy UCITS ETF', isin: 'IE00B1XNHC34', ticker: 'INRG', pea: false, ter: 0.65, hist10y: 5.1, risk: 'Très Élevé', color: '#14b8a6' }
    ];

    function App() {
      const [initialCapital, setInitialCapital] = useState(5000);
      const [recurringAmount, setRecurringAmount] = useState(300);
      const [frequency, setFrequency] = useState(12);
      const [years, setYears] = useState(20);
      const [inflation, setInflation] = useState(2.0);
      const [withdrawalRate, setWithdrawalRate] = useState(4.0);

      const [portfolio, setPortfolio] = useState([
        { etfId: 'wpea', weight: 60 },
        { etfId: 'panx', weight: 40 }
      ]);

      // Calcul automatique de la performance pondérée et du TER d'après les ETF sélectionnés
      const portfolioMetrics = useMemo(() => {
        let totalWeight = portfolio.reduce((acc, curr) => acc + curr.weight, 0);
        if (totalWeight === 0) return { avgTer: 0.2, avgHist: 10.0, valid: false, riskLabel: 'Modéré' };

        let avgTer = 0;
        let avgHist = 0;
        let riskScore = 0;
        const riskWeights = { 'Faible': 1, 'Modéré': 2, 'Élevé': 3, 'Très Élevé': 4 };

        portfolio.forEach(item => {
          const etf = ETF_DATABASE.find(e => e.id === item.etfId);
          if (etf) {
            avgTer += (etf.ter * item.weight) / totalWeight;
            avgHist += (etf.hist10y * item.weight) / totalWeight;
            riskScore += (riskWeights[etf.risk] || 2) * (item.weight / 100);
          }
        });

        let riskLabel = 'Modéré';
        if (riskScore > 3.2) riskLabel = 'Très Élevé';
        else if (riskScore > 2.6) riskLabel = 'Élevé';
        else if (riskScore < 1.8) riskLabel = 'Conservateur';

        return {
          avgTer: Number(avgTer.toFixed(2)),
          avgHist: Number(avgHist.toFixed(2)),
          totalWeight,
          valid: totalWeight === 100,
          riskLabel
        };
      }, [portfolio]);

      const simulationData = useMemo(() => {
        const data = [];
        const periodsPerYear = Number(frequency);
        const totalPeriods = years * periodsPerYear;
        
        const netReturn = portfolioMetrics.avgHist - portfolioMetrics.avgTer;
        const netTerRatePerPeriod = Math.pow(1 + Math.max(-90, netReturn) / 100, 1 / periodsPerYear) - 1;
        const inflationRatePerPeriod = Math.pow(1 + Math.max(-90, netReturn - inflation) / 100, 1 / periodsPerYear) - 1;

        let totalInvested = initialCapital;
        let netPeaValue = initialCapital;
        let inflationAdjustedValue = initialCapital;

        data.push({
          year: 0,
          invested: Math.round(totalInvested),
          peaNet: Math.round(netPeaValue),
          ctoNet: Math.round(netPeaValue),
          inflationNet: Math.round(inflationAdjustedValue)
        });

        for (let p = 1; p <= totalPeriods; p++) {
          totalInvested += recurringAmount;
          netPeaValue = (netPeaValue + recurringAmount) * (1 + netTerRatePerPeriod);
          inflationAdjustedValue = (inflationAdjustedValue + recurringAmount) * (1 + inflationRatePerPeriod);

          if (p % periodsPerYear === 0) {
            const currentYear = p / periodsPerYear;
            const capitalGain = Math.max(0, netPeaValue - totalInvested);
            
            const peaTax = currentYear >= 5 ? capitalGain * 0.172 : capitalGain * 0.30;
            const ctoTax = capitalGain * 0.30;

            data.push({
              year: currentYear,
              invested: Math.round(totalInvested),
              peaNet: Math.round(netPeaValue - peaTax),
              ctoNet: Math.round(netPeaValue - ctoTax),
              inflationNet: Math.round(inflationAdjustedValue)
            });
          }
        }
        return data;
      }, [initialCapital, recurringAmount, frequency, years, inflation, portfolioMetrics]);

      const lastDataPoint = simulationData[simulationData.length - 1];
      const taxSaved = lastDataPoint ? lastDataPoint.peaNet - lastDataPoint.ctoNet : 0;
      const fireMonthly = lastDataPoint ? Math.round((lastDataPoint.peaNet * (withdrawalRate / 100)) / 12) : 0;

      const pieChartData = useMemo(() => {
        return portfolio.map(item => {
          const etf = ETF_DATABASE.find(e => e.id === item.etfId);
          return {
            name: etf ? etf.ticker : item.etfId,
            value: item.weight,
            color: etf ? etf.color : '#64748b'
          };
        }).filter(d => d.value > 0);
      }, [portfolio]);

      const handleWeightChange = (index, value) => {
        const updated = [...portfolio];
        updated[index].weight = Number(value);
        setPortfolio(updated);
      };

      const handleAddEtf = (etfId) => {
        if (!portfolio.find(p => p.etfId === etfId)) {
          setPortfolio([...portfolio, { etfId, weight: 0 }]);
        }
      };

      const handleRemoveEtf = (index) => {
        setPortfolio(portfolio.filter((_, i) => i !== index));
      };

      return (
        <div className="max-w-7xl mx-auto px-4 py-6 md:py-10 space-y-8">
          {/* Header */}
          <header className="glass-card glow-effect p-6 rounded-2xl flex flex-col lg:flex-row lg:items-center justify-between gap-6">
            <div>
              <h1 className="text-2xl md:text-3xl font-extrabold bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 bg-clip-text text-transparent">
                Terminal d'Investissement & ETF Ultra Pro
              </h1>
              <p className="text-slate-400 text-xs md:text-sm mt-1">Simulation dynamique basée sur l'historique réel des ETF</p>
            </div>
            <div className="bg-emerald-950/80 border border-emerald-800 text-emerald-300 px-4 py-2 rounded-xl text-xs md:text-sm font-semibold">
              Rendement historique moyen sélectionné : <span className="font-mono font-bold text-emerald-400">{portfolioMetrics.avgHist}% / an</span>
            </div>
          </header>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
            {/* Contrôles & Saisies Manuelles */}
            <div className="glass-card rounded-2xl p-6 space-y-6">
              <h2 className="text-lg font-bold border-b border-slate-800 pb-3">1. Paramètres de Capital (Saisie Libre)</h2>

              <div>
                <label className="text-xs text-slate-400 block mb-1">Apport Initial (€)</label>
                <input
                  type="number"
                  step="500"
                  min="0"
                  max="1000000"
                  value={initialCapital}
                  onChange={(e) => setInitialCapital(Number(e.target.value))}
                  className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 font-mono text-emerald-400 font-bold outline-none focus:border-emerald-500"
                />
              </div>

              <div>
                <label className="text-xs text-slate-400 block mb-1">Versement Mensuel / Périodique (€)</label>
                <input
                  type="number"
                  step="50"
                  min="0"
                  max="50000"
                  value={recurringAmount}
                  onChange={(e) => setRecurringAmount(Number(e.target.value))}
                  className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 font-mono text-emerald-400 font-bold outline-none focus:border-emerald-500"
                />
              </div>

              <div>
                <label className="text-xs text-slate-400 block mb-2">Fréquence</label>
                <select
                  value={frequency}
                  onChange={(e) => setFrequency(Number(e.target.value))}
                  className="w-full bg-slate-900 border border-slate-700 text-slate-100 rounded-lg p-2.5 text-xs md:text-sm"
                >
                  <option value={12}>Mensuelle (12/an)</option>
                  <option value={4}>Trimestrielle (4/an)</option>
                  <option value={1}>Annuelle (1/an)</option>
                </select>
              </div>

              <div>
                <div className="flex justify-between text-sm mb-2">
                  <span className="text-slate-400">Durée du projet</span>
                  <span className="font-mono text-emerald-400 font-bold">{years} ans</span>
                </div>
                <input
                  type="range"
                  min="1"
                  max="40"
                  step="1"
                  value={years}
                  onChange={(e) => setYears(Number(e.target.value))}
                  className="w-full accent-emerald-500 bg-slate-800 h-2 rounded-lg cursor-pointer"
                />
              </div>

              <div className="pt-4 border-t border-slate-800 space-y-4">
                <h3 className="text-xs font-semibold uppercase tracking-wider text-slate-300">Hypothèses Macro</h3>
                <div>
                  <div className="flex justify-between text-xs text-slate-400 mb-1">
                    <span>Inflation annuelle</span>
                    <span className="font-mono text-amber-400">{inflation}%</span>
                  </div>
                  <input
                    type="range"
                    min="0"
                    max="5"
                    step="0.1"
                    value={inflation}
                    onChange={(e) => setInflation(Number(e.target.value))}
                    className="w-full accent-emerald-500 bg-slate-800 h-1.5 rounded-lg cursor-pointer"
                  />
                </div>
              </div>
            </div>

            {/* Graphiques & Résultats */}
            <div className="lg:col-span-2 space-y-6">
              <div className="glass-card rounded-2xl p-6">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-6">
                  <h2 className="text-lg font-bold">Projections & Comparatif PEA vs CTO</h2>
                  <span className="text-xs font-semibold px-3 py-1 rounded-full bg-emerald-950 border border-emerald-800 text-emerald-300">
                    Gain Fiscal : +{taxSaved.toLocaleString('fr-FR')} €
                  </span>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
                  <div className="bg-slate-900/90 p-3 rounded-xl border border-slate-800">
                    <span className="text-xs text-slate-400 block">Capital Investi</span>
                    <span className="text-base md:text-lg font-bold font-mono text-slate-100">{lastDataPoint?.invested.toLocaleString('fr-FR')} €</span>
                  </div>
                  <div className="bg-emerald-950/40 p-3 rounded-xl border border-emerald-800">
                    <span className="text-xs text-slate-400 block">Valeur PEA Nette</span>
                    <span className="text-base md:text-lg font-bold font-mono text-emerald-300">{lastDataPoint?.peaNet.toLocaleString('fr-FR')} €</span>
                  </div>
                  <div className="bg-slate-900/90 p-3 rounded-xl border border-slate-800">
                    <span className="text-xs text-slate-400 block">Valeur CTO Nette</span>
                    <span className="text-base md:text-lg font-bold font-mono text-slate-300">{lastDataPoint?.ctoNet.toLocaleString('fr-FR')} €</span>
                  </div>
                  <div className="bg-slate-900/90 p-3 rounded-xl border border-slate-800">
                    <span className="text-xs text-slate-400 block">Rente (4%)</span>
                    <span className="text-base md:text-lg font-bold font-mono text-amber-300">{fireMonthly.toLocaleString('fr-FR')} €/mo</span>
                  </div>
                </div>

                <div className="h-80 w-full">
                  <ResponsiveContainer width="100%" height="100%">
                    <AreaChart data={simulationData}>
                      <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" />
                      <XAxis dataKey="year" stroke="#64748b" tick={{ fontSize: 12 }} />
                      <YAxis stroke="#64748b" tickFormatter={(val) => `${(val / 1000).toFixed(0)}k`} tick={{ fontSize: 12 }} />
                      <Tooltip
                        contentStyle={{ backgroundColor: '#090d16', borderColor: '#334155', borderRadius: '12px', color: '#f8fafc' }}
                        formatter={(val) => [`${val.toLocaleString('fr-FR')} €`, '']}
                      />
                      <Legend />
                      <Area type="monotone" dataKey="peaNet" name="PEA Net" stroke="#10b981" fill="#10b981" fillOpacity={0.15} strokeWidth={2.5} />
                      <Area type="monotone" dataKey="ctoNet" name="CTO Net" stroke="#64748b" fill="#64748b" fillOpacity={0.05} strokeWidth={2} />
                      <Area type="monotone" dataKey="invested" name="Capital Investi" stroke="#3b82f6" fill="none" strokeDasharray="4 4" strokeWidth={2} />
                    </AreaChart>
                  </ResponsiveContainer>
                </div>
              </div>

              {/* Constructeur de Portefeuille ETF */}
              <div className="glass-card rounded-2xl p-6 space-y-6">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-slate-800 pb-3">
                  <div>
                    <h2 className="text-lg font-bold">2. Composition du Portefeuille & Historique ETF</h2>
                    <p className="text-xs text-slate-400">Ajustez les pourcentages : le rendement global s'adapte automatiquement</p>
                  </div>
                  <div className="text-right">
                    <span className={`text-xs md:text-sm font-bold ${portfolioMetrics.valid ? 'text-emerald-400' : 'text-amber-400'}`}>
                      Total Allocation : {portfolioMetrics.totalWeight}% {portfolioMetrics.valid ? '✓' : '(Doit faire 100%)'}
                    </span>
                    <span className="text-xs text-slate-400 block">Frais TER moyens : {portfolioMetrics.avgTer}% | Risque : <strong className="text-cyan-300">{portfolioMetrics.riskLabel}</strong></span>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
                  <div className="md:col-span-2 space-y-3">
                    {portfolio.map((item, index) => {
                      const etf = ETF_DATABASE.find(e => e.id === item.etfId);
                      return (
                        <div key={index} className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 bg-slate-900/80 p-3 rounded-xl border border-slate-800">
                          <div className="flex-1">
                            <div className="font-semibold text-xs md:text-sm text-slate-200">{etf?.name}</div>
                            <div className="text-xs text-slate-400 font-mono">Hist. 10 ans : <strong className="text-emerald-400">+{etf?.hist10y}%/an</strong> | TER : {etf?.ter}%</div>
                          </div>
                          <div className="flex items-center gap-2">
                            <input
                              type="number"
                              min="0"
                              max="100"
                              value={item.weight}
                              onChange={(e) => handleWeightChange(index, e.target.value)}
                              className="w-16 bg-slate-950 border border-slate-700 rounded-lg p-1.5 text-center text-xs font-mono text-emerald-400 font-bold"
                            />
                            <span className="text-xs text-slate-400">%</span>
                            <button
                              onClick={() => handleRemoveEtf(index)}
                              className="text-red-400 hover:text-red-300 text-xs px-2 py-1 bg-red-950/40 rounded border border-red-900/60"
                            >
                              ✕
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  <div className="h-48 flex items-center justify-center bg-slate-900/50 rounded-xl border border-slate-800">
                    <ResponsiveContainer width="100%" height="100%">
                      <PieChart>
                        <Pie data={pieChartData} dataKey="value" nameKey="name" cx="50%" cy="50%" innerRadius={45} outerRadius={70} paddingAngle={3}>
                          {pieChartData.map((entry, index) => (
                            <Cell key={`cell-${index}`} fill={entry.color} />
                          ))}
                        </Pie>
                        <Tooltip contentStyle={{ backgroundColor: '#090d16', borderColor: '#334155', borderRadius: '8px', color: '#f8fafc', fontSize: '11px' }} />
                      </PieChart>
                    </ResponsiveContainer>
                  </div>
                </div>

                <div className="pt-2">
                  <label className="text-xs text-slate-400 block mb-2">Ajouter un ETF de la base :</label>
                  <div className="flex flex-wrap gap-2">
                    {ETF_DATABASE.map(etf => (
                      <button
                        key={etf.id}
                        onClick={() => handleAddEtf(etf.id)}
                        className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1.5 rounded-lg border border-slate-700 font-mono transition-colors"
                      >
                        + {etf.ticker} (+{etf.hist10y}%)
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
